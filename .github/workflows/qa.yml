name: qa
on:
  push:
    branches: [qa]
    paths: [qa/heic.py, .github/workflows/qa.yml]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: |
          git fetch origin main && git checkout origin/main -- cover.py requirements.txt && pip install -r requirements.txt
          python qa/heic.py 2>&1 | tee qa_log.txt
        continue-on-error: true
      - if: always()
        run: |
          mkdir -p qa/heic_out && cp qa_log.txt qa/heic_out/ || true
          git config user.name qa-bot; git config user.email qa-bot@users.noreply.github.com
          git reset -q HEAD cover.py requirements.txt; git checkout -- cover.py requirements.txt || true
          git add -f qa/heic_out && git commit -m "heic qa results" && git pull --rebase && git push
